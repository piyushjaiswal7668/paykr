name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  phase-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: paykr_test
          MYSQL_ROOT_PASSWORD: testing-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: paykr_test
      DB_USERNAME: root
      DB_PASSWORD: testing-only-password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      PAYKR_ADMIN_EMAIL: admin@example.test
      PAYKR_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Check out the exact event commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Paykr runtimes
        uses: ./.github/actions/setup-runtime
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix services/whatsapp-sidecar --no-audit --no-fund
      - run: node --test services/tests/*.test.js
      - run: composer install --no-interaction --prefer-dist
      - run: npm run typecheck && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --seed --force
      - run: composer check
      - run: npm test --prefix packages/merchant-sdk
      - run: node --test tests/Integration/wallet.test.mjs
      - run: PAYKR_GO_PATH="$(command -v go)" node tests/Integration/webhook-verifiers.mjs
      - run: php tests/Support/check-merchant-demo.php
      - run: php tests/Support/check-checkout.php
      - run: bash -n deploy/oracle-deploy.sh
      - run: python3 -m unittest discover -s tests/Release -p "test_*.py"
      - run: python3 scripts/package-release-assets.py
